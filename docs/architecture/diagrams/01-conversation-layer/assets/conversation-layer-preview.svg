<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1600" viewBox="0 0 1400 1600" role="img" aria-labelledby="title description">
  <title id="title">AI Bridge Conversation Layer</title>
  <desc id="description">Canonical target route from Product Owner through Factory Chat, Conversation, Conversation Understanding, Conversation State Engine, and Mission Resolution across the Runtime Boundary to Mission.</desc>
  <style>
    .title { font: 700 32px Arial, sans-serif; fill: #172554; text-anchor: middle; }
    .subtitle { font: 16px Arial, sans-serif; fill: #475569; text-anchor: middle; }
    .heading { font: 700 22px Arial, sans-serif; text-anchor: middle; }
    .body { font: 15px Arial, sans-serif; text-anchor: middle; }
    .arrow { fill: none; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="1400" height="1600" fill="#ffffff"/>
  <text x="700" y="55" class="title">AI Bridge — Conversation Layer</text>
  <text x="700" y="82" class="subtitle">Canonical target architecture · Article IV — Conversation to Mission</text>

  <rect x="250" y="120" width="900" height="105" rx="14" fill="#E5E7EB" stroke="#475569" stroke-width="2"/>
  <text x="700" y="158" class="heading" fill="#0F172A">Product Owner</text>
  <text x="700" y="187" class="body" fill="#0F172A">Business intent, approvals, and governing decisions</text>

  <path d="M700 225 V285" class="arrow" stroke="#475569"/>
  <rect x="250" y="300" width="900" height="120" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="700" y="338" class="heading" fill="#172554">Factory Chat</text>
  <text x="700" y="367" class="body" fill="#172554">Localized UI adapter for messages, attachments, streaming, approvals, and projections</text>
  <text x="700" y="391" class="body" fill="#172554">Never owns business state</text>

  <path d="M700 420 V480" class="arrow" stroke="#2563EB"/>
  <rect x="250" y="495" width="900" height="120" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="700" y="533" class="heading" fill="#14532D">Conversation</text>
  <text x="700" y="562" class="body" fill="#14532D">Owns durable human interaction history, attachments, participants, Persona references,</text>
  <text x="700" y="586" class="body" fill="#14532D">and conversation-specific state</text>

  <path d="M700 615 V675" class="arrow" stroke="#16A34A"/>
  <rect x="250" y="690" width="900" height="125" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="700" y="728" class="heading" fill="#14532D">Conversation Understanding</text>
  <text x="700" y="757" class="body" fill="#14532D">Classifies intent and goal; assembles context; performs governed Conversation, Mission,</text>
  <text x="700" y="781" class="body" fill="#14532D">AKB, Repository, semantic, and LLM analysis</text>

  <path d="M700 815 V875" class="arrow" stroke="#16A34A"/>
  <rect x="250" y="890" width="900" height="125" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="700" y="928" class="heading" fill="#14532D">Conversation State Engine</text>
  <text x="700" y="957" class="body" fill="#14532D">Exclusive Conversation Domain progression owner: maturity, missing information,</text>
  <text x="700" y="981" class="body" fill="#14532D">alternatives, decision points, and Mission necessity</text>

  <path d="M700 1015 V1075" class="arrow" stroke="#16A34A"/>
  <rect x="250" y="1090" width="900" height="115" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="700" y="1128" class="heading" fill="#14532D">Mission Resolution</text>
  <text x="700" y="1157" class="body" fill="#14532D">Exclusive human-Conversation Mission-intake boundary: new, update, closure, or no action</text>

  <path d="M700 1205 V1255" class="arrow" stroke="#EA580C"/>
  <rect x="120" y="1270" width="1160" height="80" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="4" stroke-dasharray="12 8"/>
  <text x="700" y="1302" class="heading" fill="#9A3412">RUNTIME BOUNDARY</text>
  <text x="700" y="1330" class="body" fill="#9A3412">Mission is the first business object that may enter the operational runtime path</text>

  <path d="M700 1350 V1405" class="arrow" stroke="#7E22CE"/>
  <rect x="250" y="1420" width="900" height="125" rx="14" fill="#F3E8FF" stroke="#7E22CE" stroke-width="2"/>
  <text x="700" y="1458" class="heading" fill="#581C87">Mission</text>
  <text x="700" y="1487" class="body" fill="#581C87">First runtime business object with immutable identity, goal, scope, priority, ownership,</text>
  <text x="700" y="1511" class="body" fill="#581C87">metadata, state, correlation, and evidence references; MSM owns lifecycle</text>
</svg>

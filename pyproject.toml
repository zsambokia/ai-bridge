[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bridge"
version = "0.1.0"
description = "Minimal Django foundation for AI Bridge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Django>=5.2,<5.3", "PyYAML>=6.0,<7.0"]

[tool.setuptools]
packages = ["bridge", "bridge.settings", "codingproviderproof", "codingproviderproof.migrations", "confirmationproof", "confirmationproof.migrations", "core", "core.tests", "projects", "projects.management", "projects.management.commands", "projects.migrations", "projects.tests", "scripts", "storybook", "storybook.migrations"]

[project.optional-dependencies]
dev = ["django-stubs[compatible-mypy]>=5.2,<5.3", "mypy>=1.13,<2.0", "pytest>=8.3,<9.0", "pytest-django>=4.9,<5.0", "ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "bridge.settings.test"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["core/tests", "projects/tests", "storybook"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "bridge.settings.test"
